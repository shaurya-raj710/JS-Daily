<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Color Changer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Color Changer</h1>
        <p>Click a button to change the background color:</p>

        <div class="button-group">
            <button class="color-btn" id="red">Red</button>
            <button class="color-btn" id="blue">Blue</button>
            <button class="color-btn" id="green">Green</button>
            <button class="color-btn" id="yellow">Yellow</button>
            <button class="color-btn" id="purple">Purple</button>
        </div>

        <button id="reset-btn">Reset</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
